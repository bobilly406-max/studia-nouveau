<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studia — Apprends. Explore. Brille à ta façon.</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0FF;--card:#fff;--ink:#241F4A;--soft:#6B6794;--violet:#6C4CF1;--sun:#FFC93C;--mint:#27B994;--coral:#FF6B6B;--line:#E2DCFA;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17143A;--card:#231F55;--ink:#F4F1FF;--soft:#B1ABE0;--line:#3A3590}}
:root[data-theme="dark"]{--bg:#17143A;--card:#231F55;--ink:#F4F1FF;--soft:#B1ABE0;--line:#3A3590}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:500;line-height:1.5;--fs:1.05rem;--pad:14px}
body.kids{--fs:1.45rem;--pad:22px}
h1,h2,button{font-family:'Baloo 2','Nunito',system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 18px 48px}
button{cursor:pointer;color:var(--ink)}
button:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:800 1.4rem 'Baloo 2',sans-serif;color:var(--violet)}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font-weight:700;padding:6px 14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.hero{background:var(--violet);color:#fff;border-radius:30px;padding:22px;margin-top:16px;display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}
.fox{width:90px;height:90px}
.hero h1{font-size:1.5rem;line-height:1.15;margin:0 0 4px}
.hero p{margin:0;opacity:.92}
.snap{grid-column:1/-1;display:flex;justify-content:center;gap:10px;border-radius:22px;background:var(--sun);color:#3A2A00;font:800 1.35rem 'Baloo 2',sans-serif;padding:16px;cursor:pointer;box-shadow:0 6px 0 #D9A400}
.snap:active{transform:translateY(5px);box-shadow:0 1px 0 #D9A400}
.snap input{display:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;margin-top:16px}
.hide{display:none!important}
.load{text-align:center;padding:30px 10px;font:700 1.2rem 'Baloo 2',sans-serif}
.spin{font-size:3rem;display:inline-block;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{border-color:var(--coral);color:var(--ink)}
.tabs{display:flex;gap:8px;margin-top:16px}
.tabs button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px;font-weight:700;font-size:1.05rem}
.tabs button[aria-selected="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.tag{display:inline-block;background:var(--mint);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700;font-size:.85rem}
.res h2{margin:6px 0 8px;font-size:1.5rem}
.res p{font-size:var(--fs);margin:0}
.flash{width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:20px;padding:var(--pad) 18px;margin-top:10px;font-size:var(--fs)}
.flash b{display:block}
.flash span{display:none;margin-top:6px;color:var(--violet);font-weight:700}
.flash.open span{display:block}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-weight:700}
.prog{height:14px;border-radius:99px;background:var(--line);margin:8px 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .4s}
.q{font:800 calc(var(--fs)*1.3)/1.2 'Baloo 2',sans-serif;margin:14px 0}
.ans{display:grid;gap:10px}
.ans button{text-align:left;border:3px solid var(--line);background:var(--card);border-radius:20px;padding:var(--pad) 16px;font-size:var(--fs);font-weight:700;box-shadow:0 4px 0 var(--line)}
.ans button.ok{background:var(--mint);border-color:var(--mint);color:#fff}
.ans button.no{border-color:var(--coral)}
.why{margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--bg)}
.go{width:100%;border:0;border-radius:20px;background:var(--violet);color:#fff;font-size:1.2rem;font-weight:800;padding:14px;margin-top:12px}
.again{border:0;border-radius:18px;background:var(--sun);color:#3A2A00;font-weight:800;padding:12px 22px;margin-top:12px;font-size:1.1rem}
.profiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pf{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1rem}
.pf.on{background:var(--violet);border-color:var(--violet);color:#fff}
.pf.add{border-style:dashed;color:var(--violet)}
#hist h2{font-size:1.25rem;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chips button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sess{display:flex;gap:8px;margin-top:10px}
.sess .open{flex:1;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:10px 14px;font-size:1rem}
.sess .open b{display:block;font-family:'Nunito',sans-serif}
.sess small{color:var(--soft)}
.sess .x{border:2px solid var(--line);background:var(--card);border-radius:14px;width:44px}
.mute{color:var(--soft);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.6rem/1.1 'Baloo 2',sans-serif}
.stat span{font-size:.82rem;color:var(--soft)}
.lvl{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;margin-top:10px}
.lvl .prog{margin:6px 0}
.bdg{display:flex;gap:12px;flex-wrap:wrap;font-size:1.7rem}
.bdg span{filter:grayscale(1);opacity:.3}
.bdg span.on{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:22px;font-weight:700;max-width:92%;text-align:center;transition:transform .25s}
#toast.on{transform:translate(-50%,0)}
footer{margin-top:28px;text-align:center;font-size:.8rem;color:var(--soft)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
<div class="top">
<div class="brand">✨ Studia</div>
<div class="seg" role="group" aria-label="Mode"><button type="button" id="mAdo" aria-pressed="true">Ados</button><button type="button" id="mKids" aria-pressed="false">Petits</button></div>
</div>
<div class="profiles" id="profiles"></div>

<section class="hero">
<svg class="fox" viewBox="0 0 120 120" role="img" aria-label="Le renard Studia"><polygon points="14,12 48,34 22,64" fill="#FF8A2B"/><polygon points="106,12 72,34 98,64" fill="#FF8A2B"/><ellipse cx="60" cy="68" rx="46" ry="42" fill="#FF8A2B"/><path d="M14 76 Q60 126 106 76 Q90 60 60 84 Q30 60 14 76Z" fill="#fff"/><circle cx="42" cy="62" r="6" fill="#241F4A"/><circle cx="78" cy="62" r="6" fill="#241F4A"/><ellipse cx="60" cy="82" rx="7" ry="5" fill="#241F4A"/></svg>
<div><h1 id="hi">Salut ! On révise quoi aujourd'hui ?</h1><p>Prends ta leçon en photo. Je prépare ta fiche et ton quiz.</p></div>
<label class="snap">📸 Photographier ma leçon<input type="file" id="file" accept="image/jpeg,image/png,image/webp"></label>
</section>

<section id="gam" aria-label="Ma progression"></section>

<section id="load" class="card load hide" role="status"><span class="spin">🦊</span><div id="loadT">Je lis ta leçon…</div></section>
<section id="err" class="card err hide" role="alert"></section>

<section id="out" class="hide">
<div class="tabs" role="tablist">
<button type="button" role="tab" id="t0" aria-selected="true">📝 Résumé</button>
<button type="button" role="tab" id="t1" aria-selected="false">🃏 Fiches</button>
<button type="button" role="tab" id="t2" aria-selected="false">🎯 Quiz</button>
</div>
<div class="card res" id="p0"></div>
<div class="card hide" id="p1"></div>
<div class="card hide" id="p2"></div>
</section>

<section class="card" id="hist"><h2>📚 Mes séances</h2><div class="chips" id="chips"></div><div id="list"></div></section>

<footer>Studia utilise l'IA et peut se tromper : vérifie avec ton cahier. Ne mets aucune donnée personnelle sur tes photos.</footer>
</main>
<div id="toast" role="status"></div>
<script>
var $=function(i){return document.getElementById(i)},mode="ado",R=null,qi=0,sc=0,lock=false;
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function setMode(m){mode=m;if(cur){cur.mode=m;save()}document.body.className=m==="kids"?"kids":"";$("mAdo").setAttribute("aria-pressed",m==="ado");$("mKids").setAttribute("aria-pressed",m==="kids")}
$("mAdo").onclick=function(){setMode("ado")};$("mKids").onclick=function(){setMode("kids")};
function show(id,on){$(id).classList.toggle("hide",!on)}
function fail(m){show("load",false);show("err",true);$("err").textContent=m}

// Réduit la photo avant l'envoi (plus rapide, moins lourd)
function shrink(file){return new Promise(function(ok,ko){var im=new Image(),u=URL.createObjectURL(file);
im.onload=function(){var s=Math.min(1,1500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.82))};
im.onerror=function(){ko()};im.src=u})}

$("file").onchange=function(e){var f=e.target.files[0];e.target.value="";if(!f)return;
show("err",false);show("out",false);show("load",true);$("loadT").textContent=mode==="kids"?"Je regarde ta leçon… 🔍":"Je lis ta leçon…";
shrink(f).then(function(img){return fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img,mode:mode})})})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.erreur||"Erreur");return j})})
.then(function(d){R=d;show("load",false);cs=addSession(d);render();celebrate()})
.catch(function(er){fail(er.message&&er.message!=="Failed to fetch"?er.message:"Impossible de lire cette photo. Essaie encore.")})};

function tab(n){for(var i=0;i<3;i++){$("t"+i).setAttribute("aria-selected",i===n);show("p"+i,i===n)}}
[0,1,2].forEach(function(n){$("t"+n).onclick=function(){tab(n)}});

function render(){show("out",true);tab(0);
$("p0").innerHTML='<span class="tag" style="background:'+col(R.matiere)+'">'+esc(R.matiere)+'</span><h2>'+esc(R.titre)+'</h2><p>'+esc(R.resume)+'</p>';
$("p1").innerHTML=R.fiches.map(function(f){return '<button type="button" class="flash"><b>'+esc(f.q)+'</b><span>'+esc(f.r)+'</span></button>'}).join("")+'<p style="color:var(--soft);margin:10px 0 0">Touche une fiche pour voir la réponse.</p>';
[].forEach.call($("p1").querySelectorAll(".flash"),function(b){b.onclick=function(){b.classList.toggle("open")}});
qi=0;sc=0;quiz()}

function quiz(){var n=R.quiz.length;
if(qi>=n){endQuiz();$("p2").innerHTML='<div style="text-align:center"><div style="font-size:2.6rem">'+"⭐".repeat(sc)+"☆".repeat(n-sc)+'</div><h2 style="font-size:1.8rem;margin:6px 0">'+(sc===n?"Score parfait ! 🏆":"Bien joué !")+'</h2><p>'+(lastGain>0?"Tu as gagné "+lastGain+" points !":"Bats ton meilleur score pour gagner des points.")+'</p><button class="again" id="re" type="button">Rejouer le quiz</button></div>';
$("re").onclick=function(){qi=0;sc=0;quiz()};if(sc>0)burst(innerWidth/2,innerHeight/3,150);return}
var d=R.quiz[qi];lock=false;
$("p2").innerHTML='<div class="meta"><span>Question '+(qi+1)+' sur '+n+'</span><span>⭐ '+sc+'</span></div><div class="prog"><i style="width:'+(qi/n*100)+'%"></i></div><h2 class="q">'+esc(d.q)+'</h2><div class="ans" id="ans"></div><div id="why"></div>';
d.choix.forEach(function(c,k){var b=document.createElement("button");b.type="button";b.textContent=c;b.onclick=function(){pick(k,b)};$("ans").appendChild(b)})}

function pick(k,b){if(lock)return;var d=R.quiz[qi],bs=$("ans").children,good=k===d.bonne;
if(!good&&mode==="kids"){b.classList.add("no");b.disabled=true;$("why").innerHTML='<div class="why">Oups, ce n\'est pas grave ! Essaie encore. 💪</div>';return}
lock=true;bs[d.bonne].classList.add("ok");if(good){sc++;var r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,60)}else b.classList.add("no");
$("why").innerHTML='<div class="why"><b>'+(good?(mode==="kids"?"Bravo ! 🎉":"Exact !"):"Pas tout à fait.")+'</b> '+esc(d.explication)+'</div><button class="go" id="nx" type="button">'+(qi===R.quiz.length-1?"Voir mon score":"Question suivante")+'</button>';
$("nx").onclick=function(){qi++;quiz()}}

// Profils et séances (sauvegardés sur cet appareil)
var KEY="studia:v1",db={profiles:[],active:null,sessions:[]},cur=null,cs=null,filt="Toutes",AV=["🦊","🐼","🦁","🐸","🐙","🦄"];
var COL={"Maths":"#3DA5FF","Français":"#FF6B6B","Sciences":"#27B994","Histoire":"#9B6BFF","Anglais":"#E8920C"};
function col(m){return COL[m]||"#6B6794"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function newProfile(name){var p={id:uid(),name:name,av:AV[db.profiles.length%AV.length],mode:"ado"};db.profiles.push(p);db.active=p.id;cur=p;save();return p}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profiles&&s.profiles.length)db=s}catch(e){}
if(!db.profiles.length){newProfile((prompt("Bienvenue sur Studia ! Quel est ton prénom ?")||"").trim().slice(0,20)||"Élève")}
cur=db.profiles.filter(function(p){return p.id===db.active})[0]||db.profiles[0];db.active=cur.id;setMode(cur.mode||"ado")}
function switchTo(p){cur=p;db.active=p.id;save();setMode(p.mode||"ado");show("out",false);show("err",false);filt="Toutes";renderProfiles();renderHist()}
function renderProfiles(){var h=db.profiles.map(function(p){return '<button type="button" class="pf'+(p.id===cur.id?' on':'')+'" data-id="'+p.id+'">'+p.av+' '+esc(p.name)+'</button>'}).join("");
h+='<button type="button" class="pf add" id="addP">+ Profil</button>';
if(db.profiles.length>1)h+='<button type="button" class="pf" id="delP" aria-label="Supprimer ce profil">🗑️</button>';
$("profiles").innerHTML=h;renderStats();$("hi").textContent="Salut "+cur.name+" ! On révise quoi aujourd'hui ?";
[].forEach.call($("profiles").querySelectorAll("[data-id]"),function(b){b.onclick=function(){switchTo(db.profiles.filter(function(p){return p.id===b.dataset.id})[0])}});
$("addP").onclick=function(){var n=(prompt("Prénom de l'élève ?")||"").trim().slice(0,20);if(n){switchTo(newProfile(n))}};
if($("delP"))$("delP").onclick=function(){if(!confirm("Supprimer le profil "+cur.name+" et toutes ses séances ?"))return;
var id=cur.id;db.profiles=db.profiles.filter(function(p){return p.id!==id});db.sessions=db.sessions.filter(function(s){return s.pid!==id});switchTo(db.profiles[0])}}
function addSession(d){var s={id:uid(),pid:cur.id,date:Date.now(),matiere:d.matiere||"Autre",titre:d.titre||"Leçon",res:d,score:null};
db.sessions.unshift(s);db.sessions=db.sessions.slice(0,100);save();renderHist();reward(10,"Nouvelle leçon");return s}
// Points, série de jours, niveaux et badges
var lastGain=0,tt;
function day(d){var x=d||new Date();return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
function yest(){var y=new Date();y.setDate(y.getDate()-1);return day(y)}
function lvl(xp){var L=[["Débutant",0],["Explorateur",100],["Champion",300],["Légende",700]],i=0;while(i<L.length-1&&xp>=L[i+1][1])i++;return{i:i,name:L[i][0],from:L[i][1],to:L[i+1]?L[i+1][1]:null}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},3500)}
function endQuiz(){if(!cs)return;var prev=cs.score||0,n=cs.res.quiz.length,gain=0;
if(cs.score==null||sc>cs.score){gain=(sc-prev)*10;if(sc===n&&prev<n)gain+=20;cs.score=sc;save();renderHist()}
reward(gain,sc===n?"Score parfait !":"Quiz terminé")}
function reward(pts,msg){var before=lvl(cur.xp||0).i,t=day(),m=[];
if(cur.last!==t){cur.streak=cur.last===yest()?(cur.streak||0)+1:1;cur.last=t;cur.best=Math.max(cur.best||0,cur.streak);if(cur.streak>1)m.push("🔥 "+cur.streak+" jours d'affilée !")}
cur.xp=(cur.xp||0)+pts;lastGain=pts;save();renderStats();
var L=lvl(cur.xp);if(L.i>before){m.unshift("Niveau "+(L.i+1)+" : "+L.name+" ! 🎉");burst(innerWidth/2,innerHeight/3,120)}
toast((pts?"+"+pts+" points · ":"")+msg+(m.length?" · "+m.join(" · "):""))}
function badges(){var ss=db.sessions.filter(function(s){return s.pid===cur.id}),su={};ss.forEach(function(s){su[s.matiere]=1});
return [["📸","Première leçon",ss.length>0],["🎯","Premier quiz",ss.some(function(s){return s.score!=null})],["🏆","Score parfait",ss.some(function(s){return s.score!=null&&s.score===s.res.quiz.length})],["🔥","3 jours d'affilée",(cur.best||0)>=3],["🌈","3 matières",Object.keys(su).length>=3]]}
function renderStats(){var ss=db.sessions.filter(function(s){return s.pid===cur.id}),stars=ss.reduce(function(a,s){return a+(s.score||0)},0),
st=(cur.last===day()||cur.last===yest())?cur.streak||0:0,xp=cur.xp||0,L=lvl(xp),B=badges(),got=B.filter(function(b){return b[2]}).length,
pct=L.to?Math.round((xp-L.from)/(L.to-L.from)*100):100;
$("gam").innerHTML='<div class="stats"><div class="stat"><b>🔥 '+st+'</b><span>'+(st>1?"jours d'affilée":"jour d'affilée")+'</span></div><div class="stat"><b>⭐ '+stars+'</b><span>étoiles</span></div><div class="stat"><b>🏅 '+got+'</b><span>badges</span></div></div>'
+'<div class="lvl"><b style="font-family:Baloo 2,sans-serif">Niveau '+(L.i+1)+' · '+L.name+'</b><div class="prog"><i style="width:'+pct+'%"></i></div><small style="color:var(--soft)">'+(L.to?"Encore "+(L.to-xp)+" points pour le niveau suivant":"Niveau maximum atteint !")+'</small><div class="bdg" style="margin-top:8px">'
+B.map(function(b){return '<span class="'+(b[2]?"on":"")+'" role="img" aria-label="'+b[1]+(b[2]?"":" (à débloquer)")+'" title="'+b[1]+'">'+b[0]+'</span>'}).join("")+'</div></div>'}
function renderHist(){var ss=db.sessions.filter(function(s){return s.pid===cur.id}),subj=["Toutes"];
ss.forEach(function(s){if(subj.indexOf(s.matiere)<0)subj.push(s.matiere)});if(subj.indexOf(filt)<0)filt="Toutes";
$("chips").innerHTML=subj.length>2?subj.map(function(m){return '<button type="button" data-f="'+esc(m)+'" aria-pressed="'+(m===filt)+'">'+esc(m)+'</button>'}).join(""):"";
var shown=ss.filter(function(s){return filt==="Toutes"||s.matiere===filt});
$("list").innerHTML=shown.length?shown.map(function(s){var dt=new Date(s.date).toLocaleDateString("fr-CA",{day:"numeric",month:"short"});
return '<div class="sess"><button type="button" class="open" data-o="'+s.id+'"><span class="tag" style="background:'+col(s.matiere)+'">'+esc(s.matiere)+'</span><b>'+esc(s.titre)+'</b><small>'+dt+(s.score!=null?' · ⭐ '+s.score+'/'+s.res.quiz.length:'')+'</small></button><button type="button" class="x" data-x="'+s.id+'" aria-label="Supprimer cette séance">🗑️</button></div>'}).join(""):'<p class="mute">Rien ici pour l\'instant. Prends ta première leçon en photo et elle apparaîtra ici ! 🦊</p>';
[].forEach.call($("chips").querySelectorAll("[data-f]"),function(b){b.onclick=function(){filt=b.dataset.f;renderHist()}});

// Confettis
var cv=$("c"),cx=cv.getContext("2d"),P=[],run=false,calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function celebrate(){burst(innerWidth/2,innerHeight/3,80)}
function burst(x,y,n){if(calm)return;var cols=["#FFC93C","#27B994","#FF6B6B","#6C4CF1","#3DA5FF"];
for(var k=0;k<n;k++)P.push({x:x,y:y,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,s:5+Math.random()*6,c:cols[k%5],r:Math.random()*6,l:90+Math.random()*40});
if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.l>0});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
if(P.length)requestAnimationFrame(tick);else run=false}
</script>
